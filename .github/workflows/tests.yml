name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check open_ai_hci tests examples tools
      - name: Test (Linux: virtual display for the tkinter tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a pytest
      - name: Test
        if: runner.os != 'Linux'
        run: pytest
      - name: Core imports without optional AI dependencies
        run: |
          pip uninstall -y onnxruntime websockets
          python -c "import open_ai_hci; print(open_ai_hci.__version__)"
