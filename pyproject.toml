[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ai-hci"
dynamic = ["version"]
description = "Modular, real-time Human-Computer Interaction framework: webcam hand & face gestures to mouse, keyboard and WebSocket events. Fast by default, AI by choice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "open-ai-hci contributors" }]
keywords = ["hci", "gesture", "hand-tracking", "mediapipe", "opencv", "accessibility", "computer-vision", "touchless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Multimedia :: Video :: Capture",
    "Typing :: Typed",
]
# Lightweight core: deterministic CV only, no ML runtimes.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
# Optional AI / integration plugins (pip install "open-ai-hci[ai]")
ai = ["onnxruntime>=1.16", "websockets>=13"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]
torch = ["torch>=2.0"]
yaml = ["pyyaml>=6"]
train = ["scikit-learn>=1.3", "skl2onnx>=1.16", "onnxruntime>=1.16"]
all = ["open-ai-hci[ai,voice,yaml,train]"]
dev = [
    "pytest>=8",
    "onnx>=1.15",
    "pyyaml>=6",
    "ruff>=0.5",
    "open-ai-hci[ai,train]",
]

[project.scripts]
open-ai-hci = "open_ai_hci.__main__:main"

[project.urls]
Homepage = "https://github.com/TheOnlyGooseBall/open-ai-hci"
Issues = "https://github.com/TheOnlyGooseBall/open-ai-hci/issues"

[tool.setuptools.packages.find]
include = ["open_ai_hci*"]

[tool.setuptools.package-data]
open_ai_hci = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "open_ai_hci._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:open_ai_hci.*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B027", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "F401", "F841", "B018", "B017"]
"examples/*" = ["E402"]
